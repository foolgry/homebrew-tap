name: sync-cask


# Tracks foolgry/dsh-desktop releases and bumps the cask version + sha256.
# Uses this repo's own GITHUB_TOKEN, so no PAT secret is needed.

on:
  schedule:
    # 11:00 / 15:00 / 19:00 Beijing time (UTC+8), two hours after the desktop
    # repo's 09/13/17 build slots so a fresh release is usually already out.
    - cron: '0 3,7,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bump cask to the latest dsh-desktop release
        run: |
          set -euo pipefail
          tag=$(gh release view --repo foolgry/dsh-desktop --json tagName --jq .tagName)
          version="${tag#v}"
          if grep -q "version \"$version\"" Casks/dsh-desktop.rb; then
            echo "already at $version, nothing to do"
            exit 0
          fi
          gh release download "$tag" --repo foolgry/dsh-desktop \
            --pattern '*-mac-arm64.dmg' --dir /tmp/dmg --clobber
          sha=$(shasum -a 256 /tmp/dmg/*-mac-arm64.dmg | cut -d' ' -f1)
          # Rewrite the url with the release's real asset name — dsh-desktop
          # renamed artifacts from "DSH.Desktop-*" to "DSH-Desktop-*" (spaces
          # in artifact names break electron-updater downloads).
          asset=$(basename /tmp/dmg/*-mac-arm64.dmg)
          sed -i \
            -e "s/^  version \".*\"/  version \"$version\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" \
            -e "s|releases/download/v#{version}/[^\"]*|releases/download/v#{version}/$asset|" \
            Casks/dsh-desktop.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/dsh-desktop.rb
          git commit -m "dsh-desktop $version"
          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
